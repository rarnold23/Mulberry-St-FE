<svg width="425" height="239" viewBox="0 0 425 239" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="425" height="239" fill="url(#background)"/>
  
  <!-- Noise texture -->
  <rect width="425" height="239" filter="url(#noise)" opacity="0.1"/>
  
  <!-- Play button circle -->
  <g transform="translate(212.5, 119.5)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="25" fill="rgba(255,255,255,0.1)"/>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.2)"/>
    
    <!-- Play triangle -->
    <polygon points="8,0 -6,-12 -6,12" fill="white"/>
  </g>
  
  <!-- Text -->
  <text x="212.5" y="170" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Click to Play Live Stream
  </text>
  
  <text x="212.5" y="190" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="12">
    Little Italy, NYC
  </text>
</svg>
